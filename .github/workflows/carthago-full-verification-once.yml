# One-shot full Carthago verification on the authorized CARTHAGE Windows runner.
# The push path filter means normal application commits DO NOT retrigger this job.
# Delete this workflow after the result is captured, if desired.
name: CARTHAGO one-shot full verification

on:
  push:
    branches:
      - feature/carthago-reliability-hardening
    paths:
      - .github/workflows/carthago-full-verification-once.yml

permissions:
  contents: read

concurrency:
  group: carthago-one-shot-full-verification
  cancel-in-progress: true

jobs:
  full-verification:
    name: Full builds, xUnit, replay quality and holdout
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      VSTEST_CONNECTION_TIMEOUT: '300'
    steps:
      - name: Verify correct host before checking out or running tests
        shell: pwsh
        run: |
          if ($env:COMPUTERNAME -ine 'CARTHAGE') {
            throw 'This verification is restricted to CARTHAGE.'
          }
          Write-Host 'Host verified: CARTHAGE'

      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify commit identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'Checked-out SHA mismatch.' }
          Write-Host ("Verification commit: {0}" -f $actual)

      - name: Run full repository verification and isolated holdout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $logDirectory = Join-Path $env:RUNNER_TEMP 'carthago-one-shot-verification'
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null
          $fullLog = Join-Path $logDirectory 'full-verification.log'
          & pwsh -NoProfile -File './verify-local.ps1' -Details *> $fullLog
          $fullExit = $LASTEXITCODE
          Write-Host ("Full verification exit code: {0}" -f $fullExit)
          foreach ($line in (Get-Content -LiteralPath $fullLog)) {
            if ($line -match '^(START:|PASS:|FAIL:|FAILED stages:|Replay quality:|Rule catalog audit:)') {
              Write-Host $line
            }
          }
          $holdoutExit = 99
          if (Test-Path -LiteralPath 'Carthago.Benchmarks/bin/Release' -PathType Container) {
            $holdoutLog = Join-Path $logDirectory 'holdout.log'
            & pwsh -NoProfile -File './scripts/evaluate-holdout.ps1' -NoBuild *> $holdoutLog
            $holdoutExit = $LASTEXITCODE
            Write-Host ("Synthetic holdout exit code: {0}" -f $holdoutExit)
            foreach ($line in (Get-Content -LiteralPath $holdoutLog)) {
              if ($line -match '^(PASS:|HOLDOUT FAILED:|WARNING:)') { Write-Host $line }
            }
          } else {
            Write-Host 'Synthetic holdout not run: benchmark build output unavailable.'
          }
          Write-Host 'Private, potentially sensitive full diagnostics remain only in runner temporary storage.'
          if ($fullExit -ne 0 -or $holdoutExit -ne 0) {
            throw 'Carthago full verification and/or separate holdout did not pass.'
          }
          Write-Host 'PASS: full repository verification and pinned synthetic holdout.'
