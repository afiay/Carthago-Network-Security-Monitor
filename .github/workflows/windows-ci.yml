name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DOTNET.sln

      - name: Build
        run: dotnet build DOTNET.sln --configuration Release --no-restore

      - name: Run Windows-targeted tests
        run: dotnet test Carthago.Tests/Carthago.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=carthago-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
