name: Carthago centralized validation

# Single owner-controlled entry point. No push, PR or scheduled execution.
# Private output stays on CARTHAGE; no artifacts or packet payloads uploaded.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Explicit validation profile (never runs automatically)'
        required: true
        type: choice
        options:
          - dns-wire-codec
          - dns-wire-packet
          - r102-accuracy
          - dns-wire-replay
          - dns-source-contract
          - v2-contract
          - v2-readiness
          - rule-batches
          - baseline
          - detection-quality
          - full-verification
      authorization:
        description: 'Owner gate: enter NOW_TEST_TIME to authorize execution'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: carthago-centralized-validation
  cancel-in-progress: false

jobs:
  selected-validation:
    name: Authorized scoped validation on CARTHAGE
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization == 'NOW_TEST_TIME' && inputs.profile != 'detection-quality' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      VALIDATION_PROFILE: ${{ inputs.profile }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      VSTEST_CONNECTION_TIMEOUT: '300'
    steps:
      - name: Verify CARTHAGE before checking out source
        shell: pwsh
        run: |
          if ($env:COMPUTERNAME -ine 'CARTHAGE') {
            throw 'Validation is restricted to CARTHAGE.'
          }

      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check exact commit identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'Checked-out commit mismatch.' }

      - name: Install .NET 8 SDK for code suites
        if: ${{ inputs.profile != 'v2-readiness' && inputs.profile != 'dns-source-contract' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Execute only the selected profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $profile = $env:VALIDATION_PROFILE
          $privateDirectory = Join-Path $env:RUNNER_TEMP 'carthago-central-validation'
          New-Item -ItemType Directory -Path $privateDirectory -Force | Out-Null

          function Invoke-Private([string]$label, [string]$executable, [string[]]$arguments) {
            $privateLog = Join-Path $privateDirectory ($label + '.log')
            & $executable @arguments *> $privateLog
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Write-Host "::error title=Carthago validation::$label failed (exit code $code). See private CARTHAGE log."
              exit 1
            }
            Write-Host "PASS: $label; detailed output retained on CARTHAGE only."
          }

          switch ($profile) {
            'dns-wire-codec' {
              if (-not (Test-Path 'Carthago.Tests/DnsWireNameCodecTests.cs')) { throw 'Codec contract not authored.' }
              Invoke-Private 'dns-wire-codec' 'dotnet' @('test','Carthago.Tests/Carthago.Tests.csproj','-c','Release','--filter','FullyQualifiedName~DnsWireNameCodecTests')
            }
            'dns-wire-packet' {
              if (-not (Test-Path 'Carthago.Tests/DnsWirePacketTests.cs')) { throw 'Packet contract not authored.' }
              Invoke-Private 'dns-wire-packet' 'dotnet' @('test','Carthago.Tests/Carthago.Tests.csproj','-c','Release','-p:DefineConstants=CARTHAGO_DNS_WIRE_STAGE2','--filter','FullyQualifiedName~DnsWirePacketTests')
            }
            'r102-accuracy' {
              if (-not (Test-Path 'Carthago.Tests/R102BinaryDnsPrecisionTests.cs')) { throw 'R102 binary contract not authored.' }
              Invoke-Private 'r102-accuracy' 'dotnet' @('test','Carthago.Tests/Carthago.Tests.csproj','-c','Release','-p:DefineConstants=CARTHAGO_DNS_WIRE_STAGE3','--filter','FullyQualifiedName~R102BinaryDnsPrecisionTests|FullyQualifiedName~R102DistinctTxtCorrelationTests|FullyQualifiedName~R102AdvancedAccuracyBatchTests|FullyQualifiedName~DnsReplayTelemetryDiagnosticsTests')
            }
            'dns-wire-replay' {
              if (-not (Test-Path 'Carthago.Tests/DnsWireReplayHydratorTests.cs')) { throw 'Private replay contract not authored.' }
              Invoke-Private 'dns-wire-replay' 'dotnet' @('test','Carthago.Tests/Carthago.Tests.csproj','-c','Release','-p:DefineConstants=CARTHAGO_DNS_WIRE_STAGE4','--filter','FullyQualifiedName~DnsWireReplayHydratorTests|FullyQualifiedName~SyntheticHoldoutV2ContractTests')
            }
            'dns-source-contract' {
              if (-not (Test-Path 'scripts/verify-dns-wire-source-contract.ps1')) { throw 'Source contract not authored.' }
              Invoke-Private 'dns-source-contract' 'powershell.exe' @('-NoProfile','-File','scripts/verify-dns-wire-source-contract.ps1','-TsharkPath','C:/Program Files/Wireshark/tshark.exe')
            }
            'v2-readiness' {
              Invoke-Private 'v2-readiness' 'powershell.exe' @('-NoProfile','-File','scripts/inspect-holdout-v2-readiness.ps1')
            }
            'v2-contract' {
              Invoke-Private 'v2-contract' 'dotnet' @('test','Carthago.Tests/Carthago.Tests.csproj','-c','Release','--filter','FullyQualifiedName~SyntheticHoldoutV2ContractTests')
              if (-not (Test-Path 'scripts/verify-dns-wire-source-contract.ps1')) { throw 'Private V2 source contract not authored.' }
              Invoke-Private 'v2-dns-wire-provenance' 'powershell.exe' @('-NoProfile','-File','scripts/verify-dns-wire-source-contract.ps1','-IncludeV2Provenance','-TsharkPath','C:/Program Files/Wireshark/tshark.exe')
            }
            'rule-batches' {
              Invoke-Private 'rule-batches' 'powershell.exe' @('-NoProfile','-File','scripts/verify-all-rule-batches.ps1','-HoldoutVersion','v1')
            }
            'baseline' {
              Invoke-Private 'baseline-restore' 'dotnet' @('restore','DOTNET.sln')
              Invoke-Private 'baseline-build' 'dotnet' @('build','DOTNET.sln','--configuration','Release','--no-restore')
              Invoke-Private 'baseline-tests' 'dotnet' @('test','Carthago.Tests/Carthago.Tests.csproj','--configuration','Release','--no-build')
            }
            'full-verification' {
              Invoke-Private 'full-regression' 'pwsh' @('-NoProfile','-File','verify-local.ps1','-Details')
              Invoke-Private 'frozen-v1-holdout' 'pwsh' @('-NoProfile','-File','scripts/evaluate-holdout.ps1','-NoBuild')
            }
            default { throw 'Unsupported validation profile.' }
          }

          Write-Host 'No source approval, rule promotion or holdout freeze performed.'

  windows-detection-quality:
    name: Windows build, tests and alert-level replay
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization == 'NOW_TEST_TIME' && inputs.profile == 'detection-quality' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    env:
      VSTEST_CONNECTION_TIMEOUT: '300'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Verify authorized CARTHAGE host
        shell: pwsh
        run: |
          if ($env:COMPUTERNAME -ine 'CARTHAGE') {
            throw 'Detection-quality verification is restricted to CARTHAGE.'
          }

      - name: Check out the exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Quiet restore, build, tests and replay validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $logs = Join-Path $env:RUNNER_TEMP 'carthago-private-verify'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $failures = [System.Collections.Generic.List[string]]::new()

          function Invoke-Quiet([string]$label, [string]$file, [string[]]$arguments) {
            $output = Join-Path $logs ($label + '.log')
            & $file @arguments *> $output
            if ($LASTEXITCODE -ne 0) {
              $script:failures.Add($label)
              Write-Host "::error title=Carthago verification failed::$label failed (exit code $LASTEXITCODE). Details retained locally on runner, not published."
              if ($label -eq 'tests') {
                Get-Content $output | Where-Object { $_ -match '^(Failed!|Passed!|Test Run Failed)' } | Select-Object -Last 3 | ForEach-Object {
                  $safe = $_ -replace '[A-Za-z]:\\[^ ]+', '[redacted-path]'
                  Write-Host "::error::$safe"
                }
              }
              return $false
            }
            return $true
          }

          $ok = Invoke-Quiet 'restore-tests' 'dotnet' @('restore','Carthago.Tests/Carthago.Tests.csproj','--verbosity','quiet','--nologo')
          if (-not $ok) { exit 1 }
          $ok = Invoke-Quiet 'restore-benchmarks' 'dotnet' @('restore','Carthago.Benchmarks/Carthago.Benchmarks.csproj','--verbosity','quiet','--nologo')
          if (-not $ok) { exit 1 }
          $ok = Invoke-Quiet 'build-tests' 'dotnet' @('build','Carthago.Tests/Carthago.Tests.csproj','--configuration','Release','--no-restore','--verbosity','quiet','--nologo')
          if (-not $ok) { exit 1 }
          $ok = Invoke-Quiet 'build-benchmarks' 'dotnet' @('build','Carthago.Benchmarks/Carthago.Benchmarks.csproj','--configuration','Release','--no-restore','--verbosity','quiet','--nologo')
          if (-not $ok) { exit 1 }

          $testsOk = Invoke-Quiet 'tests' 'dotnet' @('test','Carthago.Tests/Carthago.Tests.csproj','--configuration','Release','--no-build','--no-restore','--verbosity','quiet','--logger','trx;LogFileName=carthago-tests.trx','--results-directory','build-verify/test-results')
          $benchOk = Invoke-Quiet 'benchmark' 'dotnet' @('run','--project','Carthago.Benchmarks','--configuration','Release','--no-build','--no-restore','--','--replay-dir','Tests/RuleReplaySamples','--output-dir','build-verify','--compare-profiles','--explain-shadow')
          if ($benchOk) {
            try {
              $report = Get-Content 'build-verify/tuning-benchmark.json' -Raw | ConvertFrom-Json
              # The fixture inventory is the source of truth; a stale or
              # partial benchmark must not produce a green quality check.
              $fixtureCount = @(Get-ChildItem -LiteralPath 'Tests/RuleReplaySamples' -Filter '*.json' -File -Recurse).Count
              if ($fixtureCount -lt 78) { throw 'insufficient-replay-samples' }
              if ([int]$report.summary.replaySampleCount -ne $fixtureCount -or
                  @($report.sampleResults).Count -ne $fixtureCount) { throw 'fixture-count-mismatch' }
              $invalid = @($report.sampleResults | Where-Object { $_.errors -and @($_.errors | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 })
              if ($invalid.Count -gt 0) { throw 'invalid-replay-expectations' }

              # Sample-level alert metrics, not raw matches or event counts.
              # Print only aggregate confusion matrices, never payloads,
              # authorization headers, process command lines or credentials.
              $quality = $report.summary.sampleLevelQualityByProfile
              $expectedProfiles = @('Enterprise','HomeLab','IoTHeavy','OTSegment','Research','SmallBusiness')
              if ($null -eq $quality) { throw 'missing-alert-quality' }
              $badProfiles = [System.Collections.Generic.List[string]]::new()
              foreach ($name in $expectedProfiles) {
                $entry = $quality.PSObject.Properties[$name]
                if ($null -eq $entry -or $null -eq $entry.Value) { throw 'missing-alert-quality' }
                $m = $entry.Value
                $precision = if ($null -eq $m.precision) { 'N/A' } else { '{0:P1}' -f [double]$m.precision }
                $recall = if ($null -eq $m.recall) { 'N/A' } else { '{0:P1}' -f [double]$m.recall }
                $f1 = if ($null -eq $m.f1Score) { 'N/A' } else { '{0:P1}' -f [double]$m.f1Score }
                Write-Host ("{0}: TP={1} FP={2} FN={3} TN={4} precision={5} recall={6} F1={7}" -f
                  $name, $m.truePositives, $m.falsePositives, $m.falseNegatives,
                  $m.trueNegatives, $precision, $recall, $f1)
                if ([int]$m.falsePositives -gt 0) { $badProfiles.Add($name) }
              }
              if ($badProfiles.Count -gt 0) {
                Write-Host ("::error title=Benign replay alert regression::False positives in: " + ($badProfiles -join ', '))
                throw 'benign-alert-regression'
              }
            } catch {
              $failures.Add('replay-validation')
              $reason = switch ($_.Exception.Message) {
                'insufficient-replay-samples' { 'insufficient replay samples' }
                'fixture-count-mismatch' { 'benchmark sample count differs from checked-out fixture inventory' }
                'invalid-replay-expectations' { 'one or more invalid replay expectations' }
                'missing-alert-quality' { 'missing per-profile alert-level quality metrics' }
                'benign-alert-regression' { 'benign replays emitted alerts in one or more profiles' }
                default { 'report unreadable or schema mismatch' }
              }
              Write-Host "::error title=Replay validation failed::$reason"
            }
          }
          if ($benchOk -and $testsOk -and $failures.Count -eq 0) {
            # Run a distinct, pinned synthetic holdout. Only aggregate gate
            # status is published; full details stay on the Windows runner.
            $holdoutOk = Invoke-Quiet 'holdout' 'pwsh' @(
              '-NoProfile','-File','scripts/evaluate-holdout.ps1','-NoBuild')
            if (-not $holdoutOk) {
              Write-Host '::error title=Synthetic holdout regression::Frozen holdout did not satisfy rule recognition, label, or zero-benign-alert invariants.'
            }
          }
          if ($failures.Count -gt 0) {
            Write-Host ("::error title=Verification summary::Failed stages: " + ($failures -join ', '))
            exit 1
          }
          Write-Host 'Carthago development replays and separate synthetic holdout passed.'

      # Artifact uploads are temporarily disabled: the account has reached
      # its Actions artifact storage quota. Restore uploads only after
      # reviewing output for sensitive information and storage availability.
