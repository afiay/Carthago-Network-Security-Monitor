name: Carthago detection quality

on:
  push:
    branches:
      - feature/carthago-reliability-hardening
    paths:
      - 'Carthago/**'
      - 'Carthago.Tests/**'
      - 'Carthago.Benchmarks/**'
      - 'Tests/RuleReplaySamples/**'
      - '.github/workflows/carthago-detection-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carthago-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-detection-quality:
    name: Windows build, tests and alert-level replay
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      VSTEST_CONNECTION_TIMEOUT: '300'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore test and benchmark projects
        shell: pwsh
        run: |
          dotnet restore Carthago.Tests/Carthago.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore Carthago.Benchmarks/Carthago.Benchmarks.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release binaries
        shell: pwsh
        run: |
          dotnet build Carthago.Tests/Carthago.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Carthago.Benchmarks/Carthago.Benchmarks.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run xUnit suite
        shell: pwsh
        run: |
          dotnet test Carthago.Tests/Carthago.Tests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=carthago-tests.trx' --results-directory build-verify/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Benchmark all alert profiles (not raw matches)
        shell: pwsh
        run: |
          dotnet run --project Carthago.Benchmarks --configuration Release --no-build --no-restore -- --replay-dir Tests/RuleReplaySamples --output-dir build-verify --compare-profiles --explain-shadow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reject invalid replay expectations
        shell: pwsh
        run: |
          $report = Get-Content 'build-verify/tuning-benchmark.json' -Raw | ConvertFrom-Json
          if ($report.summary.replaySampleCount -lt 19) { throw 'Replay corpus unexpectedly shrank below the 19-sample baseline.' }
          $invalid = @($report.sampleResults | Where-Object { @($_.errors).Count -gt 0 })
          foreach ($sample in $invalid) {
            Write-Host ("Replay '{0}' failed: {1}" -f $sample.name, ($sample.errors -join '; '))
          }
          if ($invalid.Count -gt 0) { throw "$($invalid.Count) replay samples failed their explicit expectations." }
          foreach ($profile in $report.summary.sampleLevelQualityByProfile.PSObject.Properties) {
            $q = $profile.Value
            Write-Host ("{0}: TP={1} FP={2} FN={3} TN={4} precision={5} recall={6} F1={7}" -f $profile.Name, $q.truePositives, $q.falsePositives, $q.falseNegatives, $q.trueNegatives, $q.precision, $q.recall, $q.f1Score)
          }

      - name: Preserve test and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carthago-detection-quality-${{ github.run_id }}
          path: |
            build-verify/test-results/**/*.trx
            build-verify/tuning-benchmark.json
            build-verify/tuning-benchmark.md
          if-no-files-found: warn
          retention-days: 14
