name: Carthago detection quality

on:
  push:
    branches:
      - feature/carthago-reliability-hardening
    paths:
      - 'Carthago/**'
      - 'Carthago.Tests/**'
      - 'Carthago.Benchmarks/**'
      - 'Tests/RuleReplaySamples/**'
      - '.github/workflows/carthago-detection-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carthago-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-detection-quality:
    name: Windows build, tests and alert-level replay
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    env:
      VSTEST_CONNECTION_TIMEOUT: '300'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Quiet restore, build, tests and replay validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $logs = Join-Path $env:RUNNER_TEMP 'carthago-private-verify'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $failures = [System.Collections.Generic.List[string]]::new()

          function Invoke-Quiet([string]$label, [string]$file, [string[]]$arguments) {
            $output = Join-Path $logs ($label + '.log')
            & $file @arguments *> $output
            if ($LASTEXITCODE -ne 0) {
              $script:failures.Add($label)
              Write-Host "::error title=Carthago verification failed::$label failed (exit code $LASTEXITCODE). Details retained locally on runner, not published."
              if ($label -eq 'tests') {
                Get-Content $output | Where-Object { $_ -match '^(Failed!|Passed!|Test Run Failed)' } | Select-Object -Last 3 | ForEach-Object {
                  $safe = $_ -replace '[A-Za-z]:\\[^ ]+', '[redacted-path]'
                  Write-Host "::error::$safe"
                }
              }
              return $false
            }
            return $true
          }

          $ok = Invoke-Quiet 'restore-tests' 'dotnet' @('restore','Carthago.Tests/Carthago.Tests.csproj','--verbosity','quiet','--nologo')
          if (-not $ok) { exit 1 }
          $ok = Invoke-Quiet 'restore-benchmarks' 'dotnet' @('restore','Carthago.Benchmarks/Carthago.Benchmarks.csproj','--verbosity','quiet','--nologo')
          if (-not $ok) { exit 1 }
          $ok = Invoke-Quiet 'build-tests' 'dotnet' @('build','Carthago.Tests/Carthago.Tests.csproj','--configuration','Release','--no-restore','--verbosity','quiet','--nologo')
          if (-not $ok) { exit 1 }
          $ok = Invoke-Quiet 'build-benchmarks' 'dotnet' @('build','Carthago.Benchmarks/Carthago.Benchmarks.csproj','--configuration','Release','--no-restore','--verbosity','quiet','--nologo')
          if (-not $ok) { exit 1 }

          $testsOk = Invoke-Quiet 'tests' 'dotnet' @('test','Carthago.Tests/Carthago.Tests.csproj','--configuration','Release','--no-build','--no-restore','--verbosity','quiet','--logger','trx;LogFileName=carthago-tests.trx','--results-directory','build-verify/test-results')
          $benchOk = Invoke-Quiet 'benchmark' 'dotnet' @('run','--project','Carthago.Benchmarks','--configuration','Release','--no-build','--no-restore','--','--replay-dir','Tests/RuleReplaySamples','--output-dir','build-verify','--compare-profiles','--explain-shadow')
          if ($benchOk) {
            try {
              $report = Get-Content 'build-verify/tuning-benchmark.json' -Raw | ConvertFrom-Json
              if ($report.summary.replaySampleCount -lt 19) { throw 'insufficient-replay-samples' }
              $invalid = @($report.sampleResults | Where-Object { $_.errors -and @($_.errors | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 })
              if ($invalid.Count -gt 0) { throw 'invalid-replay-expectations' }
            } catch {
              $failures.Add('replay-validation')
              $reason = switch ($_.Exception.Message) {
                'insufficient-replay-samples' { 'insufficient replay samples' }
                'invalid-replay-expectations' { 'one or more invalid replay expectations' }
                default { 'report unreadable or schema mismatch' }
              }
              Write-Host "::error title=Replay validation failed::$reason"
            }
          }
          if ($failures.Count -gt 0) {
            Write-Host ("::error title=Verification summary::Failed stages: " + ($failures -join ', '))
            exit 1
          }
          Write-Host 'Carthago verification passed.'

      # Artifact uploads are temporarily disabled: the account has reached
      # its Actions artifact storage quota. Restore uploads only after
      # reviewing output for sensitive information and storage availability.
