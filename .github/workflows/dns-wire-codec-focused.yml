# Focused RED/GREEN contract verification on the authorized CARTHAGE runner.
# Deliberately excludes full verification, holdout replay, and source import.
name: DNS wire codec focused regression

on:
  push:
    branches:
      - feature/carthago-reliability-hardening
    paths:
      - .github/workflows/dns-wire-codec-focused.yml
      - Carthago.Tests/DnsWireNameCodecTests.cs
      - Carthago/Services/DnsWireNameCodec.cs

permissions:
  contents: read

concurrency:
  group: dns-wire-codec-focused
  # Supersede the previously queued RED run while no test execution is authorized.
  cancel-in-progress: true

jobs:
  codec-contract:
    # Parked: no runner allocation or test execution until owner authorization.
    if: false
    name: xUnit codec contract only
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Verify authorized CARTHAGE host
        shell: pwsh
        run: |
          if ($env:COMPUTERNAME -ine 'CARTHAGE') {
            throw 'This focused test is restricted to CARTHAGE.'
          }
          Write-Host 'Authorized host: CARTHAGE'

      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run focused DNS wire name contract
        shell: pwsh
        run: |
          dotnet test .\Carthago.Tests\Carthago.Tests.csproj `
            -c Release `
            --filter "FullyQualifiedName~DnsWireNameCodecTests" `
            --logger "console;verbosity=normal"
